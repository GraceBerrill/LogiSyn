<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#132238">
  <title>Anderson's Bakery — Mobile Production</title>
  <style>
    :root {
      --navy-900: #0b1523;
      --navy-800: #132238;
      --navy-700: #1b2f4c;
      --navy-600: #294368;
      --amber-500: #f59e0b;
      --amber-100: #fef3c7;
      --amber-800: #92400e;
      --green-500: #10b981;
      --green-100: #d1fae5;
      --green-800: #065f46;
      --blue-500: #3b82f6;
      --blue-100: #dbeafe;
      --blue-800: #1e40af;
      --slate-50: #f4f6f9;
      --slate-100: #e8ecf2;
      --slate-200: #d5dde7;
      --slate-400: #94a3b8;
      --slate-600: #64748b;
      --slate-800: #1e293b;
      --card: #ffffff;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 8px 20px -4px rgba(15, 23, 42, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--navy-800);
      color: var(--slate-800);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    #app-viewport {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      background-color: var(--slate-50);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,0.4);
    }

    /* ========================================================
       1. LOGIN VIEW
       ======================================================== */
    #view-login {
      background-color: var(--navy-800);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .login-card {
      background: white;
      width: 100%;
      border-radius: 20px;
      padding: 36px 24px 30px;
      box-shadow: var(--shadow-md);
      text-align: center;
    }

    .login-brand {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: var(--slate-400);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .login-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--navy-800);
      margin-bottom: 26px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--slate-600);
      margin-bottom: 6px;
      display: block;
    }

    .form-input {
      width: 100%;
      background: var(--slate-50);
      border: 1px solid var(--slate-200);
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      color: var(--navy-800);
      outline: none;
      transition: border 0.2s;
    }

    .form-input:focus {
      border-color: var(--navy-800);
      background: white;
    }

    .btn-login {
      width: 100%;
      background: var(--navy-800);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.15s;
    }

    .btn-login:active {
      background: var(--navy-900);
    }

    .quick-roles {
      margin-top: 18px;
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .role-chip {
      font-size: 0.72rem;
      padding: 4px 10px;
      background: var(--slate-100);
      border-radius: 999px;
      color: var(--slate-600);
      cursor: pointer;
      font-weight: 600;
    }

    .role-chip:hover {
      background: var(--slate-200);
    }

    /* ========================================================
       2. TOP STATUS BAR & HEADER
       ======================================================== */
    .app-header {
      background-color: var(--navy-800);
      color: white;
      padding: 16px 20px 20px;
    }

    .status-bar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.7);
      margin-bottom: 12px;
    }

    .header-main-title {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .header-sub-date {
      font-size: 0.75rem;
      color: var(--slate-400);
      margin-top: 2px;
    }

    /* ========================================================
       3. MAIN CONTENT BODY
       ======================================================== */
    .app-content {
      flex: 1;
      padding: 16px 16px 85px;
      overflow-y: auto;
    }

    /* Stats Row (from Dashboard Wireframe) */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 22px;
    }

    .stat-box {
      background: white;
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--slate-100);
    }

    .stat-number {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--navy-800);
      line-height: 1.1;
    }

    .stat-title {
      font-size: 0.75rem;
      color: var(--slate-600);
      font-weight: 600;
      margin-top: 4px;
    }

    /* Section Title */
    .section-heading {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--navy-800);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Search Bar */
    .search-container {
      margin-bottom: 14px;
    }

    .search-input {
      width: 100%;
      background: white;
      border: 1px solid var(--slate-200);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.85rem;
      color: var(--slate-800);
      outline: none;
    }

    /* Orders List (from Dashboard & Orders Wireframes) */
    .orders-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .order-item-card {
      background: white;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--slate-100);
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .order-item-card:active {
      transform: scale(0.99);
      background: #fafbfc;
    }

    .order-info {
      display: flex;
      flex-direction: column;
    }

    .order-number {
      font-size: 0.98rem;
      font-weight: 800;
      color: var(--navy-800);
    }

    .order-customer-name {
      font-size: 0.82rem;
      color: var(--slate-600);
      margin-top: 2px;
    }

    /* Status Pills matching Wireframe colors */
    .status-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      text-transform: capitalize;
    }

    .status-pill.pending {
      background-color: var(--amber-100);
      color: var(--amber-800);
      border: 1px solid #fde68a;
    }

    .status-pill.in-production {
      background-color: var(--blue-100);
      color: var(--blue-800);
      border: 1px solid #bfdbfe;
    }

    .status-pill.completed {
      background-color: var(--green-100);
      color: var(--green-800);
      border: 1px solid #a7f3d0;
    }

    /* ========================================================
       4. ORDER DETAIL / BREAKDOWN VIEW
       ======================================================== */
    .detail-header {
      background-color: var(--navy-800);
      color: white;
      padding: 16px 20px 18px;
    }

    .back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .product-breakdown-card {
      background: white;
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--slate-100);
      margin-bottom: 14px;
    }

    .prod-card-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--navy-800);
    }

    .prod-card-sub {
      font-size: 0.76rem;
      color: var(--slate-400);
      margin-bottom: 14px;
    }

    /* Ingredient Table */
    .wireframe-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.76rem;
      margin-bottom: 14px;
    }

    .wireframe-table th {
      text-align: left;
      color: var(--slate-400);
      font-weight: 600;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--slate-100);
    }

    .wireframe-table td {
      padding: 8px 0;
      color: var(--slate-800);
      border-bottom: 1px dashed var(--slate-100);
    }

    .wireframe-table td.col-req {
      color: var(--slate-800);
      font-weight: 600;
    }

    .wireframe-table td.col-add {
      color: #e11d48;
      font-weight: 600;
    }

    .wireframe-table td.col-used {
      color: var(--slate-600);
    }

    /* Packaging Grid */
    .pack-row {
      display: flex;
      justify-content: space-between;
      background: var(--slate-50);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .pack-label {
      color: var(--slate-600);
    }

    .pack-val {
      color: var(--navy-800);
    }

    /* Detail Action Footer */
    .detail-action-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 440px;
      background: white;
      padding: 12px 16px;
      border-top: 1px solid var(--slate-200);
      display: flex;
      gap: 10px;
      z-index: 50;
    }

    .btn-secondary {
      flex: 1;
      background: var(--slate-100);
      color: var(--navy-800);
      border: 1px solid var(--slate-200);
      padding: 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary-action {
      flex: 2;
      background: var(--navy-800);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* ========================================================
       5. CONFIRMATION POPUP (from Wireframe)
       ======================================================== */
    .modal-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 21, 35, 0.7);
      backdrop-filter: blur(2px);
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 200;
    }

    .modal-overlay.active {
      display: flex;
    }

    .confirm-card {
      background: white;
      width: 100%;
      max-width: 320px;
      border-radius: 20px;
      padding: 32px 20px 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .confirm-icon-circle {
      width: 64px;
      height: 64px;
      background: var(--green-500);
      border-radius: 50%;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 2rem;
      margin-bottom: 18px;
    }

    .confirm-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--navy-800);
      margin-bottom: 22px;
    }

    .btn-done {
      width: 100%;
      background: var(--navy-800);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* ========================================================
       6. BOTTOM NAV BAR (from Wireframes)
       ======================================================== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 440px;
      background-color: var(--navy-800);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0 12px;
      z-index: 40;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .nav-tab {
      background: none;
      border: none;
      color: var(--slate-400);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.68rem;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.15s;
    }

    .nav-tab.active {
      color: white;
    }

    .nav-icon {
      font-size: 1.25rem;
    }
  </style>
</head>
<body>

<div id="app-viewport">

  <!-- ==================== VIEW 1: LOGIN ==================== -->
  <div id="view-login">
    <div class="login-card">
      <div class="login-brand">ANDERSON'S BAKERY</div>
      <h1 class="login-title">Welcome Back</h1>

      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" id="login-username" class="form-input" placeholder="Enter your username" value="user">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="login-password" class="form-input" placeholder="Enter your password" value="user123">
      </div>

      <button class="btn-login" onclick="handleLogin()">Log In</button>

      <div class="quick-roles">
        <span class="role-chip" onclick="fillRole('user', 'user123')">Baker (User)</span>
        <span class="role-chip" onclick="fillRole('manager', 'manager123')">Manager</span>
        <span class="role-chip" onclick="fillRole('admin', 'admin123')">Admin</span>
      </div>
    </div>
  </div>

  <!-- ==================== VIEW 2: DASHBOARD ==================== -->
  <div id="view-dashboard" style="display: none;">
    <header class="app-header">
      <div class="status-bar-row">
        <span>9:41</span>
        <span id="dash-connection-status">● Live Cloud</span>
      </div>
      <h1 class="header-main-title">Dashboard</h1>
      <div class="header-sub-date" id="dash-date">10/05/2026</div>
    </header>

    <div class="app-content">
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-number" id="dash-stat-new">0</div>
          <div class="stat-title" id="dash-label-active">Active Orders</div>
        </div>
        <div class="stat-box">
          <div class="stat-number" id="dash-stat-completed">0</div>
          <div class="stat-title">Completed Orders</div>
        </div>
      </div>

      <div class="section-heading">
        <span>Recent Orders</span>
        <span style="font-size: 0.72rem; color: var(--slate-400); cursor:pointer;" onclick="fetchOrders(true)">🔄 Refresh</span>
      </div>

      <div class="orders-stack" id="dash-recent-orders">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- ==================== VIEW 3: ORDERS ==================== -->
  <div id="view-orders" style="display: none;">
    <header class="app-header">
      <div class="status-bar-row">
        <span>9:41</span>
        <span>Orders View</span>
      </div>
      <h1 class="header-main-title">Orders</h1>
      <div class="header-sub-date" id="orders-date">10/05/2026</div>
    </header>

    <div class="app-content">
      <div class="search-container">
        <input type="text" id="orders-search" class="search-input" placeholder="Search order number or customer..." oninput="handleSearch()">
      </div>

      <div class="orders-stack" id="orders-full-list">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- ==================== VIEW 4: ORDER DETAIL ==================== -->
  <div id="view-detail" style="display: none;">
    <header class="detail-header">
      <button class="back-btn" onclick="navigateBack()">‹ Back to Orders</button>
      <h2 class="header-main-title" id="detail-order-title" style="font-size: 1.25rem;">Order Details</h2>
      <div class="header-sub-date" id="detail-order-date">Date</div>
    </header>

    <div class="app-content" id="detail-content-area" style="padding-bottom: 90px;">
      <!-- Product Breakdown Sheets generated here -->
    </div>

    <div class="detail-action-bar">
      <button class="btn-secondary" onclick="alert('Export production sheet triggered.')">PRINT</button>
      <button class="btn-primary-action" id="btn-mark-status" onclick="handleDetailStatusAction()">Mark As Completed</button>
    </div>
  </div>

  <!-- ==================== CONFIRMATION MODAL ==================== -->
  <div class="modal-overlay" id="confirm-modal">
    <div class="confirm-card">
      <div class="confirm-icon-circle">✓</div>
      <div class="confirm-title" id="confirm-modal-text">Order Marked as Completed</div>
      <button class="btn-done" onclick="closeConfirmModal()">DONE</button>
    </div>
  </div>

  <!-- ==================== BOTTOM NAV BAR ==================== -->
  <nav class="bottom-nav" id="bottom-navigation" style="display: none;">
    <button class="nav-tab active" id="tab-dash" onclick="switchTab('dashboard')">
      <span class="nav-icon">📊</span>
      <span>Dashboard</span>
    </button>
    <button class="nav-tab" id="tab-orders" onclick="switchTab('orders')">
      <span class="nav-icon">📋</span>
      <span>Orders</span>
    </button>
    <button class="nav-tab" id="tab-logout" onclick="handleLogout()">
      <span class="nav-icon">🚪</span>
      <span>Log Out</span>
    </button>
  </nav>

</div>

<script>
  let allOrders = [];
  let currentOrder = null;
  let currentUserRole = 'user';
  let activeTab = 'dashboard';
  let previousView = 'dashboard';

  // Format today's date
  const now = new Date();
  const formattedDate = now.toLocaleDateString([], { day: '2-digit', month: '2-digit', year: 'numeric' });
  document.getElementById('dash-date').innerText = formattedDate;
  document.getElementById('orders-date').innerText = formattedDate;

  function fillRole(u, p) {
    document.getElementById('login-username').value = u;
    document.getElementById('login-password').value = p;
  }

  function handleLogin() {
    const user = document.getElementById('login-username').value.trim().toLowerCase();
    currentUserRole = user.includes('admin') ? 'admin' : (user.includes('manager') ? 'manager' : 'user');

    document.getElementById('view-login').style.display = 'none';
    document.getElementById('bottom-navigation').style.display = 'flex';
    switchTab('dashboard');
    fetchOrders();
  }

  function handleLogout() {
    document.getElementById('view-dashboard').style.display = 'none';
    document.getElementById('view-orders').style.display = 'none';
    document.getElementById('view-detail').style.display = 'none';
    document.getElementById('bottom-navigation').style.display = 'none';
    document.getElementById('view-login').style.display = 'flex';
  }

  function switchTab(tab) {
    activeTab = tab;
    document.getElementById('tab-dash').classList.toggle('active', tab === 'dashboard');
    document.getElementById('tab-orders').classList.toggle('active', tab === 'orders');

    document.getElementById('view-dashboard').style.display = tab === 'dashboard' ? 'block' : 'none';
    document.getElementById('view-orders').style.display = tab === 'orders' ? 'block' : 'none';
    document.getElementById('view-detail').style.display = 'none';
  }

  async function fetchOrders(showToast = false) {
    try {
      const res = await fetch('/api/orders?refresh=true');
      if (!res.ok) throw new Error('API status: ' + res.status);
      allOrders = await res.json();
      updateDashboardStats();
      renderDashboardRecent();
      renderOrdersList(allOrders);
      document.getElementById('dash-connection-status').innerText = '● Live Cloud';
    } catch (err) {
      console.warn('API fetch warning:', err);
      document.getElementById('dash-connection-status').innerText = '● Offline Cache';
      if (allOrders.length === 0) {
        // Fallback demo sample orders matching wireframe
        allOrders = [
          { orderId: '#001', customer: 'Checkers', status: 'Pending', orderDate: new Date().toISOString(), productionItems: [
            { productName: 'Hamburger Rolls', amount: 250, productionLine: 'Production 1', reqIngredients: [
              { ingredientName: 'Flour', ingredientAmount: 5, additionsAmount: 0.5, amountUsed: 5, measuredIngredient: 'bags' },
              { ingredientName: 'Eggs', ingredientAmount: 20, additionsAmount: 2, amountUsed: 22, measuredIngredient: 'doz' },
              { ingredientName: 'Salt', ingredientAmount: 4, additionsAmount: 0.4, amountUsed: 4, measuredIngredient: 'bags' }
            ], packaging: { pans: 4, trolleys: 1 } }
          ]},
          { orderId: '#002', customer: 'Spar', status: 'Completed', orderDate: new Date().toISOString(), productionItems: [
            { productName: 'Croissants', amount: 120, productionLine: 'Croissant Room', reqIngredients: [
              { ingredientName: 'Flour', ingredientAmount: 5, additionsAmount: 0.5, amountUsed: 5, measuredIngredient: 'bags' },
              { ingredientName: 'Butter', ingredientAmount: 8, additionsAmount: 0.8, amountUsed: 8, measuredIngredient: 'kg' }
            ], packaging: { pans: 4, trolleys: 2 } }
          ]}
        ];
        updateDashboardStats();
        renderDashboardRecent();
        renderOrdersList(allOrders);
      }
    }
  }

  function updateDashboardStats() {
    const active = allOrders.filter(o => (o.status || '').toLowerCase() !== 'completed').length;
    const completed = allOrders.filter(o => (o.status || '').toLowerCase() === 'completed').length;
    document.getElementById('dash-stat-new').innerText = active;
    document.getElementById('dash-stat-completed').innerText = completed;
  }

  function getStatusClass(status) {
    const s = (status || '').toLowerCase();
    if (s === 'completed') return 'completed';
    if (s === 'in production') return 'in-production';
    return 'pending';
  }

  function renderDashboardRecent() {
    const container = document.getElementById('dash-recent-orders');
    const recent = allOrders.slice(0, 4);
    if (recent.length === 0) {
      container.innerHTML = `<div style="text-align:center; padding:20px; color:var(--slate-400);">No orders found</div>`;
      return;
    }

    container.innerHTML = recent.map(o => `
      <div class="order-item-card" onclick="openOrderDetail('${o.orderId}')">
        <div class="order-info">
          <span class="order-number">${o.orderId}</span>
          <span class="order-customer-name">${o.customer || 'Customer'}</span>
        </div>
        <span class="status-pill ${getStatusClass(o.status)}">${o.status || 'Pending'}</span>
      </div>
    `).join('');
  }

  function renderOrdersList(ordersToRender) {
    const container = document.getElementById('orders-full-list');
    if (!ordersToRender || ordersToRender.length === 0) {
      container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--slate-400);">No matching orders</div>`;
      return;
    }

    container.innerHTML = ordersToRender.map(o => `
      <div class="order-item-card" onclick="openOrderDetail('${o.orderId}')">
        <div class="order-info">
          <span class="order-number">${o.orderId}</span>
          <span class="order-customer-name">${o.customer || 'Customer'}</span>
        </div>
        <span class="status-pill ${getStatusClass(o.status)}">${o.status || 'Pending'}</span>
      </div>
    `).join('');
  }

  function handleSearch() {
    const term = document.getElementById('orders-search').value.toLowerCase();
    const filtered = allOrders.filter(o => 
      (o.orderId || '').toLowerCase().includes(term) || 
      (o.customer || '').toLowerCase().includes(term)
    );
    renderOrdersList(filtered);
  }

  function openOrderDetail(orderId) {
    currentOrder = allOrders.find(o => o.orderId === orderId);
    if (!currentOrder) return;

    previousView = activeTab;
    document.getElementById('view-dashboard').style.display = 'none';
    document.getElementById('view-orders').style.display = 'none';
    document.getElementById('view-detail').style.display = 'block';

    document.getElementById('detail-order-title').innerText = `${currentOrder.customer || 'Customer'} Order ${currentOrder.orderId}`;
    document.getElementById('detail-order-date').innerText = new Date(currentOrder.orderDate).toLocaleDateString([], { day: 'numeric', month: 'long', year: 'numeric' });

    // Update Action Button based on status
    const btn = document.getElementById('btn-mark-status');
    const isCompleted = (currentOrder.status || '').toLowerCase() === 'completed';
    const isProduction = (currentOrder.status || '').toLowerCase() === 'in production';

    if (isCompleted) {
      btn.innerText = 'Completed ✓';
      btn.style.opacity = '0.6';
      btn.style.pointerEvents = 'none';
    } else if (isProduction) {
      btn.innerText = 'Mark As Completed';
      btn.style.opacity = '1';
      btn.style.pointerEvents = 'auto';
    } else {
      btn.innerText = 'Start Production';
      btn.style.opacity = '1';
      btn.style.pointerEvents = 'auto';
    }

    // Render Product Breakdown Cards matching Wireframe Table
    const area = document.getElementById('detail-content-area');
    if (currentOrder.productionItems && currentOrder.productionItems.length > 0) {
      area.innerHTML = currentOrder.productionItems.map(item => {
        let ingRows = '';
        if (item.reqIngredients && item.reqIngredients.length > 0) {
          ingRows = item.reqIngredients.map(ing => `
            <tr>
              <td>${ing.ingredientName}</td>
              <td class="col-req">${ing.ingredientAmount} ${ing.measuredIngredient}</td>
              <td class="col-add">${ing.additionsAmount || (ing.ingredientAmount * 0.1).toFixed(1)} ${ing.measuredIngredient}</td>
              <td class="col-used">${ing.amountUsed || ing.ingredientAmount} ${ing.measuredIngredient}</td>
            </tr>
          `).join('');
        } else {
          ingRows = `<tr><td colspan="4" style="color:var(--slate-400);">No ingredients specified</td></tr>`;
        }

        const pans = item.packaging ? item.packaging.pans : Math.ceil(item.amount / 50);
        const trolleys = item.packaging ? item.packaging.trolleys : Math.ceil(item.amount / 100);

        return `
          <div class="product-breakdown-card">
            <div class="prod-card-title">${item.productName}</div>
            <div class="prod-card-sub">Amount: ${item.amount} — ${item.productionLine || 'Bakery Floor'}</div>

            <table class="wireframe-table">
              <thead>
                <tr>
                  <th>Ingredients</th>
                  <th>req'd</th>
                  <th>add'l</th>
                  <th>used</th>
                </tr>
              </thead>
              <tbody>
                ${ingRows}
              </tbody>
            </table>

            <div class="pack-row">
              <span class="pack-label">Packaging</span>
              <span class="pack-val">Pans: ${pans} &nbsp;|&nbsp; Trolleys: ${trolleys}</span>
            </div>
          </div>
        `;
      }).join('');
    } else {
      area.innerHTML = `
        <div class="product-breakdown-card">
          <div class="prod-card-title">Production Order ${currentOrder.orderId}</div>
          <p style="font-size:0.85rem; color:var(--slate-600); margin-top:8px;">Standard bulk batch scaling in effect.</p>
        </div>
      `;
    }
  }

  function navigateBack() {
    switchTab(previousView);
  }

  async function handleDetailStatusAction() {
    if (!currentOrder) return;
    const isProduction = (currentOrder.status || '').toLowerCase() === 'in production';
    const nextStatus = isProduction ? 'Completed' : 'In Production';

    try {
      await fetch(`/api/orders/${encodeURIComponent(currentOrder.orderId)}/status`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(nextStatus)
      });
    } catch (e) {
      console.warn('API status update error:', e);
    }

    currentOrder.status = nextStatus;
    updateDashboardStats();
    renderDashboardRecent();
    renderOrdersList(allOrders);

    if (nextStatus === 'Completed') {
      document.getElementById('confirm-modal-text').innerText = 'Order Marked as Completed';
      document.getElementById('confirm-modal').classList.add('active');
    } else {
      openOrderDetail(currentOrder.orderId);
    }
  }

  function closeConfirmModal() {
    document.getElementById('confirm-modal').classList.remove('active');
    navigateBack();
  }
</script>

</body>
</html>
