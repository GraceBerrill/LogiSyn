name: LogiSyn CI/CD Pipeline

# Triggers on push or pull request across ALL developer branches
on: [push, pull_request]

jobs:
  build-and-test:
    name: Build, Test & Package LogiSyn
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Sets up .NET SDKs (targeting net10.0 / net10.0-windows)
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore LogiSyn/LogiSyn.csproj

      - name: Build LogiSyn Application
        run: dotnet build LogiSyn/LogiSyn.csproj --configuration Release --no-restore

      # AUTOMATED PACKAGING & DEPLOYMENT ARTIFACT

      - name: Publish Application
        run: dotnet publish LogiSyn/LogiSyn.csproj --configuration Release --output ./publish

      - name: Zip Published Executables
        run: Compress-Archive -Path ./publish/* -DestinationPath ./LogiSyn-Build.zip

      - name: Upload Deployment Artifact to GitHub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: LogiSyn-Release
          path: ./LogiSyn-Build.zip
