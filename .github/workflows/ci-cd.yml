name: LogiSyn CI/CD Pipeline

on:
  push:
    branches: [ main, Dev, fix ]
  pull_request:
    branches: [ main, Dev, fix ]

jobs:
  build-and-test:
    name: Build, Test & Package LogiSyn
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore LogiSyn.slnx

      - name: Build Solution
        run: dotnet build LogiSyn.slnx --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test LogiSyn.Tests/LogiSyn.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Publish Application
        run: dotnet publish LogiSyn/LogiSyn.csproj --configuration Release --output ./publish

      - name: Zip Published Executables
        run: Compress-Archive -Path ./publish/* -DestinationPath ./LogiSyn-Build.zip

      - name: Upload Deployment Artifact to GitHub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: LogiSyn-Release
          path: ./LogiSyn-Build.zip
