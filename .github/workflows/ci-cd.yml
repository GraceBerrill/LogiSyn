name: LogiSyn CI/CD Pipeline

on:
  push:
    branches: [ main, Dev, Fix, fix ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, Dev, Fix, fix ]

jobs:
  build-and-test:
    name: Build, Test & Package LogiSyn
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore LogiSyn.slnx

      - name: Build Solution
        run: dotnet build LogiSyn.slnx --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test LogiSyn.Tests/LogiSyn.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test_results.trx"

      - name: Publish Desktop Application
        run: dotnet publish LogiSyn/LogiSyn.csproj --configuration Release --output ./publish

      - name: Zip Published Executables
        run: Compress-Archive -Path ./publish/* -DestinationPath ./LogiSyn-Release.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogiSyn-Release-Binaries
          path: ./LogiSyn-Release.zip
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./LogiSyn-Release.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
