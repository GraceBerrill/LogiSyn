name: LogiSyn CI/CD Pipeline

# Triggers on push or pull request across ALL branches
on: [push, pull_request]

jobs:
  build-and-test:
    name: Build, Test & Package LogiSyn
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore Dependencies
        run: dotnet restore LogiSyn.slnx

      - name: Build LogiSyn Solution
        run: dotnet build LogiSyn.slnx --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test LogiSyn.slnx --configuration Release --no-build --verbosity normal

      # AUTOMATED PACKAGING & DEPLOYMENT ARTIFACT
      
      - name: Publish Application
        run: dotnet publish LogiSyn/LogiSyn.csproj --configuration Release --output ./publish

      - name: Zip Published Executables
        run: Compress-Archive -Path ./publish/* -DestinationPath ./LogiSyn-Build.zip

      - name: Upload Deployment Artifact to GitHub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: LogiSyn-Release
          path: ./LogiSyn-Build.zip
