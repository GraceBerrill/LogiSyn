name: LogiSyn CI/CD Pipeline

# Triggers on push or pull request across ALL developer branches
on: [push, pull_request]

jobs:
  build-and-test:
    name: Build, Test & Package LogiSyn
    runs-on: windows-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup MSBuild Tooling
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet Package Manager
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet Packages
        run: nuget restore LogiSyn.slnx

      - name: Build Solution with MSBuild
        run: msbuild LogiSyn.slnx /p:Configuration=Release

      - name: Setup VSTest Execution Runner
        uses: microsoft/setup-vstest@v1

      - name: Execute Automated Unit Tests
        run: vstest.console.exe **\bin\Release\*Test*.dll

      # AUTOMATED PACKAGING & DEPLOYMENT ARTIFACT

      - name: Zip Release Binaries
        run: Compress-Archive -Path .\LogiSyn\bin\Release\* -DestinationPath .\LogiSyn-Build.zip

      - name: Upload Deployment Artifact to GitHub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: LogiSyn-Release
          path: .\LogiSyn-Build.zip
