name: CI/CD Pipeline

# Triggers on push or pull request to ANY branch
on: [push, pull_request]

jobs:
  test:
    name: Build, Test & Package WinForms App
    runs-on: windows-latest   # Required for Windows Forms

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build WinForms Solution
        run: dotnet build --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      # AUTOMATED DEPLOYMENT (Build Artifact)

      - name: Publish WinForms App
        run: dotnet publish --configuration Release --output ./publish

      - name: Zip Published Files
        run: Compress-Archive -Path ./publish/* -DestinationPath ./WinFormsApp.zip

      - name: Upload Deployment Artifact to GitHub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Completed-WinForms-Build
          path: ./WinFormsApp.zip
